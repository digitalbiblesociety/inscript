# Cloudflare Worker behind https://api.inscript.org.

#   wrangler secret put API_BIBLE_KEY     # api.scripture.api.bible
#   wrangler secret put BIBLE_BRAIN_KEY   # 4.dbt.io (Faith Comes By Hearing)
#   wrangler secret put ESV_API_KEY       # api.esv.org

name = "inscript-proxy"
main = "src/index.js"
compatibility_date = "2026-07-26"

routes = [
  { pattern = "api.inscript.org", custom_domain = true }
]

[vars]
# Browser origins allowed to call the proxy. Exact origins, plus a
# "https://*.host" wildcard entry for Cloudflare Pages branch previews.
ALLOWED_ORIGINS = "https://inscript.org,https://www.inscript.org,https://dev.inscript.org,https://*.inscript.pages.dev,http://localhost:3000,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:4173"

# API.Bible bible ids the proxy will serve (NIV, CSB, NLT). Must stay in sync
# with config.apiBibleIncludeIds in the inscript frontend.
API_BIBLE_IDS = "78a9f6124f344018-01,a556c5305ee15c3f-01,d6e14a625393b4da-01"

# Bible Brain catalog pages fetched per cron run; the crawl resumes across runs.
CATALOG_PAGES_PER_RUN = "32"

[[kv_namespaces]]
binding = "CATALOG"
id = "304809faae9c4aeab4f282d310d35295"

[triggers]
crons = ["*/15 * * * *"]
